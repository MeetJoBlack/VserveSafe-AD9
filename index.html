<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Safety & AD9 Solutions Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --incorrect-bg: #fee2e2;
      --incorrect-border: #ef4444;
      --incorrect-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      -webkit-tap-highlight-color: transparent; /* Prevents mobile tap highlight ghosting */
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      background-color: #e0f2fe;
      color: #0369a1;
      letter-spacing: 0.3px;
    }

    .badge.part2 {
      background-color: #fef3c7;
      color: #b45309;
    }

    .progress-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #e2e8f0;
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      text-align: left;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      line-height: 1.4;
      outline: none;
    }

    /* Only apply hover on devices that truly support hover (prevents sticky hover on touch) */
    @media (hover: hover) and (pointer: fine) {
      .option-btn:hover:not(:disabled) {
        border-color: var(--primary);
        background-color: #f0f9ff;
      }
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-btn.wrong {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    .explanation-box {
      display: none;
      padding: 16px;
      border-radius: 10px;
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #334155;
    }

    .btn-next {
      display: none;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s ease;
    }

    .btn-next:hover {
      background-color: var(--primary-hover);
    }

    /* Result View */
    .result-container {
      display: none;
      text-align: center;
    }

    .result-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .score-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 28px 0;
      text-align: left;
    }

    .score-card {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .score-card h3 {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .score-card .score {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .total-score {
      margin-bottom: 24px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #334155;
    }

    .btn-restart {
      padding: 12px 28px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-restart:hover {
      background-color: var(--primary-hover);
    }

    @media (max-width: 540px) {
      .score-summary-grid {
        grid-template-columns: 1fr;
      }
      .quiz-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- Active Quiz View -->

      <div class="header">

      </div>
      <div class="progress-bar-container">

      <h2 id="question-text" class="question-title"></h2>
      <div id="options-container" class="options-grid"></div>

      <div id="explanation-container" class="explanation-box"></div>
      <button id="next-btn" class="btn-next">ข้อถัดไป</button>
    </div>

    <!-- Final Result View -->
    <div id="result-view" class="result-container">
      <h2 class="result-title">สรุปผลการประเมิน</h2>
      <p class="total-score" id="total-score-text"></p>

      <div class="score-summary-grid">
        <div class="score-card">
          <h3>ส่วนที่ 1: Basic Food Hygiene</h3>
          <div class="score" id="part1-score-text">0 / 6</div>
          <p id="part1-desc" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;"></p>
        </div>
        <div class="score-card">

        </div>
      </div>

      <button id="restart-btn" class="btn-restart">ทำแบบทดสอบอีกครั้ง</button>
    </div>
  </div>

          "การลดเวลาการตรวจสอบแบบเอกสารกระดาษและป้องกันความสูญเสียจากวิกฤตแบรนด์",
          "การลดค่าใช้จ่ายด้านสาธารณูปโภค เช่น ค่าน้ำและค่าไฟฟ้าในครัว",
          "การลดจำนวนพนักงานบริการในห้องอาหาร",
          "การลดการเปลี่ยนอุปกรณ์ทำครัวทุกสัปดาห์"
        ],
        correct: 0,
        explanation: "ช่วยลดภาระงานเอกสาร (Paperless Audit) และที่สำคัญคือป้องกันความเสียหายมหาศาลจากการเกิดโรคระบาดทางอาหารหรือวิกฤตศรัทธาของแบรนด์ (Brand Crisis)"
      },
      {
        part: 2,
        partLabel: "ส่วนที่ 2: AD9 Solutions",
        question: "ประโยชน์ที่ส่งผลต่อการสร้างความเชื่อมั่นของผู้บริโภค (Customer Trust) จากการประยุกต์ใช้ AD9 Solutions คือข้อใด?",
        options: [
          "การแสดงให้เห็นถึงมาตรฐานความปลอดภัยอาหารที่ตรวจสอบย้อนกลับและยืนยันได้",
          "การมอบส่วนลดราคาอาหารให้แก่ลูกค้าที่มาใช้บริการ",
          "การตกแต่งหน้าร้านให้ดูทันสมัยตามกระแสนิยม",
          "การการันตีรสชาติอาหารที่อร่อยถูกปากผู้บริโภคทุกคน"
        ],
        correct: 0,
        explanation: "สร้างความมั่นใจสูงสุดให้แก่ลูกค้า เพราะมีระบบและหลักฐานทางสุขอนามัยที่พิสูจน์ ตรวจสอบย้อนกลับ และยืนยันได้จริงตามมาตรฐานสากล"
      }
    ];

    let currentIndex = 0;
    let scorePart1 = 0;
    let scorePart2 = 0;

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const partBadge = document.getElementById("part-badge");
    const progressIndicator = document.getElementById("progress-indicator");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationContainer = document.getElementById("explanation-container");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
      // Remove any lingering focus
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      const q = questions[currentIndex];

      // Update badge
      partBadge.innerText = q.partLabel;
      if (q.part === 2) {
        partBadge.classList.add("part2");
      } else {
        partBadge.classList.remove("part2");
      }

      progressIndicator.innerText = `ข้อ ${currentIndex + 1}/${questions.length}`;
      progressBar.style.width = `${((currentIndex) / questions.length) * 100}%`;

      // Set Question
      questionText.innerText = q.question;
      optionsContainer.innerHTML = "";
      explanationContainer.style.display = "none";
      nextBtn.style.display = "none";

      // Render fresh buttons without cloned states
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      const q = questions[currentIndex];
      const buttons = optionsContainer.querySelectorAll(".option-btn");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) {
          btn.classList.add("correct");
        } else if (idx === selectedIndex) {
          btn.classList.add("wrong");
        }
      });

      // Score evaluation
      const isCorrect = (selectedIndex === q.correct);
      if (isCorrect) {
        if (q.part === 1) scorePart1++;
        if (q.part === 2) scorePart2++;
      }

      // Show explanation
      explanationContainer.innerHTML = `<strong>คำอธิบาย:</strong> ${q.explanation}`;
      explanationContainer.style.display = "block";
      nextBtn.style.display = "block";

      // Update progress fill
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
    }

    nextBtn.onclick = () => {
      // Explicitly blur the Next button to clear any sticky state
      nextBtn.blur();
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizView.style.display = "none";
      resultView.style.display = "block";

      const totalScore = scorePart1 + scorePart2;
      const totalQuestions = questions.length;
      const percentTotal = Math.round((totalScore / totalQuestions) * 100);

      document.getElementById("total-score-text").innerText = 
        `คะแนนรวม: ${totalScore} จาก ${totalQuestions} คะแนน (${percentTotal}%)`;

      document.getElementById("part1-score-text").innerText = `${scorePart1} / 6`;
      document.getElementById("part1-desc").innerText = 
        `คิดเป็น ${Math.round((scorePart1 / 6) * 100)}% (สุขอนามัยพื้นฐาน)`;

      document.getElementById("part2-score-text").innerText = `${scorePart2} / 5`;
      document.getElementById("part2-desc").innerText = 
        `คิดเป็น ${Math.round((scorePart2 / 5) * 100)}% (ระบบ AD9 Solutions)`;
    }

    document.getElementById("restart-btn").onclick = () => {
      currentIndex = 0;
      scorePart1 = 0;
      scorePart2 = 0;
      resultView.style.display = "none";
      quizView.style.display = "block";
      loadQuestion();
    };

    // Initialize
    loadQuestion();
  </script>
</body>
</html>
